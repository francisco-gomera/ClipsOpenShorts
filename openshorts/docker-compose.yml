services:
  backend:
    image: openshorts-backend:local
    build: .
    container_name: openshorts-backend
    environment:
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
      - local_auth_data:/app/data
    depends_on:
      auth-data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Named Docker volumes start owned by root. Prepare the auth database volume
  # for the non-root appuser before the backend opens SQLite.
  auth-data-init:
    image: openshorts-backend:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R appuser:appuser /app/data"]
    volumes:
      - local_auth_data:/app/data
    restart: "no"

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  local_auth_data:
